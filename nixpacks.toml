providers = ["...", "python"]

[phases.setup]
# '...' ensures Python (and any default setup) is also included
nixPkgs = ["..."]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install -r requirements.txt"
]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port 8082"

[variables]
PORT = "8081"
